<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择 Wi-Fi 信标位置</title>
    <link rel="icon" href="./assets/app.ico" sizes="any">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            color: #1f2937;
            background: rgba(15, 23, 42, 0.35);
        }

        .modal {
            box-sizing: border-box;
            width: min(1040px, calc(100% - 32px));
            height: min(760px, calc(100% - 32px));
            margin: 16px auto;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 18px 48px rgba(15, 23, 42, 0.28);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            border-bottom: 1px solid #e5e7eb;
            background: #f8fafc;
        }

        .title {
            font-size: 16px;
            font-weight: 700;
        }

        .hint {
            font-size: 12px;
            color: #6b7280;
            margin-top: 3px;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .coordinate {
            min-width: 238px;
            padding: 7px 9px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #fff;
            font-family: Consolas, monospace;
            font-size: 12px;
        }

        button {
            border: 0;
            border-radius: 6px;
            padding: 8px 12px;
            color: #fff;
            background: #2563eb;
            cursor: pointer;
            font-size: 13px;
        }

        button.secondary {
            background: #4b5563;
        }

        button:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        #map {
            width: 100%;
            flex: 1;
            min-height: 360px;
            border-top: 1px solid #e5e7eb;
        }

        .error {
            padding: 14px;
            color: #b91c1c;
            background: #fee2e2;
            border-bottom: 1px solid #fecaca;
            display: none;
        }
    </style>
    <script src="https://webapi.amap.com/maps?v=2.0&key=7d85ff33aabb204519ebeac3dd8d9035&plugin=AMap.Marker"></script>
</head>
<body>
    <div class="modal">
        <div id="error" class="error"></div>
        <div class="toolbar">
            <div>
                <div class="title">选择 Wi-Fi 信标位置</div>
                <div class="hint">点击地图设置经纬度，确认后会回填到添加信标表单。</div>
            </div>
            <div class="actions">
                <div id="coordinate" class="coordinate">尚未选择位置</div>
                <button id="confirmBtn" disabled>使用此位置</button>
                <button class="secondary" onclick="closePicker()">取消</button>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <script>
        let map;
        let marker;
        let selected;
        let mapReady = false;
        const defaultLocation = { lat: 22.539307, lng: 113.952685 };

        function showError(message) {
            const el = document.getElementById('error');
            el.textContent = message;
            el.style.display = 'block';
        }

        function format(value) {
            return Number(value).toFixed(6);
        }

        function updateSelected(lng, lat) {
            if (!mapReady || !map) return;
            selected = { lng: Number(format(lng)), lat: Number(format(lat)) };
            document.getElementById('coordinate').textContent = `lat ${format(selected.lat)}, lng ${format(selected.lng)}`;
            document.getElementById('confirmBtn').disabled = false;

            if (!marker) {
                marker = new AMap.Marker({ position: [selected.lng, selected.lat] });
                map.add(marker);
            } else {
                marker.setPosition([selected.lng, selected.lat]);
            }
            map.setCenter([selected.lng, selected.lat]);
        }

        function closePicker() {
            try {
                if (window.parent && typeof window.parent.closeWifiLocationPicker === 'function') {
                    window.parent.closeWifiLocationPicker();
                    return;
                }
            } catch (error) {
                console.warn(error);
            }
            window.parent.postMessage({ type: 'wifi-location-cancel' }, '*');
        }

        function confirmLocation() {
            if (!selected) return;
            try {
                if (window.parent && typeof window.parent.setWifiTagLocation === 'function') {
                    window.parent.setWifiTagLocation(selected);
                    window.parent.closeWifiLocationPicker();
                    return;
                }
            } catch (error) {
                console.warn(error);
            }
            window.parent.postMessage({ type: 'wifi-location-selected', ...selected }, '*');
        }

        function initMap() {
            if (!window.AMap) {
                showError('地图加载失败，请检查网络或高德地图 API。');
                document.getElementById('map').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#b91c1c;font-weight:600;">地图加载失败，请确认通过本地服务访问并检查网络。</div>';
                return;
            }

            const params = new URLSearchParams(window.location.search);
            const lat = Number(params.get('lat'));
            const lng = Number(params.get('lng'));
            const hasInitial = Number.isFinite(lat) && Number.isFinite(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180;
            const center = hasInitial ? [lng, lat] : [defaultLocation.lng, defaultLocation.lat];

            try {
                map = new AMap.Map('map', {
                    zoom: hasInitial ? 15 : 11,
                    center,
                    resizeEnable: true
                });
                mapReady = true;
            } catch (error) {
                showError(`地图初始化失败：${error.message || error}`);
                return;
            }

            map.on('click', (event) => {
                updateSelected(event.lnglat.lng, event.lnglat.lat);
            });

            if (hasInitial) {
                updateSelected(lng, lat);
            } else {
                updateSelected(defaultLocation.lng, defaultLocation.lat);
            }
            setTimeout(() => {
                if (map && typeof map.resize === 'function') map.resize();
            }, 120);
        }

        window.addEventListener('message', (event) => {
            if (!event.data || event.data.type !== 'wifi-location-picker-resize') return;
            if (mapReady && map && typeof map.resize === 'function') map.resize();
        });

        document.getElementById('confirmBtn').addEventListener('click', confirmLocation);
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initMap);
        } else {
            initMap();
        }
    </script>
</body>
</html>
