
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蓝牙调试助手</title>
    <script src="./tailwindcss.js"></script>
    <style type="text/tailwindcss">
        .font-10pt {
            font-size: 10pt;
        }
        /* Inter font for better aesthetics, monospace is the original */
        body {
            font-family: 'Inter', sans-serif, monospace;
        }
        /* Adding some basic button styling for better UX */
        button.cmd-button {
            @apply bg-blue-500 hover:bg-blue-700 text-white py-2 px-4 rounded-lg shadow-md transition-colors duration-150 ease-in-out font-10pt hover:bg-orange-700;
        }
        button.cmd-button:disabled {
            @apply bg-gray-300 hover:bg-gray-300 cursor-not-allowed shadow-none;
        }
        input[type="text"], input[type="file"] {
            @apply border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent;
        }
        label#status {
            @apply px-2 py-1 rounded-md;
        }
    </style>
</head>
<body class="font-mono p-4 md:p-8 bg-gray-50 text-gray-800">
    <div class="container mx-auto">
        <h1 class="text-3xl font-bold mb-2 text-blue-600">蓝牙调试助手</h1>
        <p class="mb-4 text-sm text-gray-600">Copyright SATELLAI 2024 (要求版本<b class="text-red-500">v8.1.0</b>以上)</p>
        
        <div class="flex flex-wrap gap-2 mb-6 items-center">

        <details class="mb-6 bg-white shadow-md rounded-lg p-4">

<script type="text/javascript">
        // document.addEventListener('DOMContentLoaded', () => { if (prompt("请输入访问密码：") !== 'satellai') document.body.innerHTML = ''; });
        uuidSvcSatellai = '00000001-ffff-4fff-8fff-5a7e11a1ffff';
        uuidCharApp = '00000002-ffff-4fff-8fff-5a7e11a1ffff';
        uuidCharDfu = '00000005-ffff-4fff-8fff-5a7e11a1ffff';
        uuidCharRtt = '00000008-ffff-4fff-8fff-5a7e11a1ffff';
        uuidSvcNus = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        uuidCharWrite = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
        uuidCharNotify = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

        class Peripheral {
            constructor() {
                this.device = null;
                this.onDisconnected = this.onDisconnected.bind(this);
            }

            async request() {
                const filt = document.getElementById('nameFilter').value;
                this.device = await navigator.bluetooth.requestDevice({
                    // 'acceptAllDevices': true,
                    // 'filters': [{ 'namePrefix': 'SATELLAI' }],
                    'filters': [{ 'namePrefix': filt?filt:'SATELLAI' }],
                    'optionalServices': [uuidSvcSatellai, uuidSvcNus]
                });
                if (!this.device) throw 'NO DEVICE SELECTED';
                this.device.addEventListener('gattserverdisconnected', this.onDisconnected);
            }

            async connect() {
                await this.device.gatt.connect();
                console.log('[INFO]CONNECTED');
                const status = document.getElementById('status');
                status.innerText = `已连接: ${this.device.name}`; status.style.color = 'green';
                document.querySelectorAll('.cmd').forEach(btn => btn.disabled = false);
                document.querySelectorAll('.rsp').forEach(lbl => lbl.innerText = '');
            }

            disconnect() {
                this.device.gatt.disconnect();
                this.device = null;
            }

            onDisconnected() {
                console.log('[WARN]DISCONNECTED');
                const status = document.getElementById('status');
                status.innerText = '未连接'; status.style.color = 'red';
                document.querySelectorAll('.cmd').forEach(btn => btn.disabled = true);
            }

            async sendCmd(svc, ch, data) {
                if (typeof data === 'string') data = new TextEncoder().encode(data);
                const service = await this.device.gatt.getPrimaryService(svc);
                const characteristic = await service.getCharacteristic(ch);
                await characteristic.writeValueWithoutResponse(data);
            }

            async startCmdNotifications(svc, ch, listener) {
                const service = await this.device.gatt.getPrimaryService(svc);
                const characteristic = await service.getCharacteristic(ch);
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', listener);
            }

            async stopCmdNotifications(svc, ch, listener) {
                const service = await this.device.gatt.getPrimaryService(svc);
                const characteristic = await service.getCharacteristic(ch);
                await characteristic.stopNotifications();
                characteristic.removeEventListener('characteristicvaluechanged', listener);
            }
        }

        const peripheral = new Peripheral();

        let resolveData = null;
        let resolveDfu = null;
        let resolveApp = null;

        document.getElementById('scanAndConnect').addEventListener('click', async event => {
            await peripheral.request();
            await peripheral.connect();
            await peripheral.startCmdNotifications(uuidSvcNus, uuidCharNotify, event => {
                if (resolveData) {
                    resolveData(new TextDecoder().decode(event.target.value));
                    resolveData = null;
                }
                else console.warn(event.target.value);
            });
            await peripheral.startCmdNotifications(uuidSvcSatellai, uuidCharApp, event => {
                if (resolveApp) {
                    resolveApp(new TextDecoder().decode(event.target.value));
                    resolveApp = null;
                }
                else console.warn(event.target.value);
            });
            await peripheral.startCmdNotifications(uuidSvcSatellai, uuidCharDfu, event => {
                if (resolveDfu) {
                    resolveDfu(event.target.value);
                    resolveDfu = null;
                }
                else console.warn(event.target.value);
            });
        });

        function timestamp() {
            const now = new Date();
            return `${now.getHours().toFixed(2)}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}.${String(now.getMilliseconds()).padStart(2,'0')}`; }

        document.getElementById('customCmd').addEventListener('keyup', async event => {
            if (event.key === 'Enter') {
                let cmd = event.target.value.trim();
                if (document.getElementById('clearOnSent').checked) cmd += '\r\n';
                const lbl = document.getElementById('customCmdRsp');
                const now = new Date();
                setTimeout(async () => {
                    await peripheral.sendCmd(uuidSvcNus, uuidCharWrite, cmd);
                }, 0);
                while (true) {
                    rsp = await new Promise(resolve => (resolveData = resolve));
                    console.log('rsp: ' + rsp);
                    lbl.innerText += `${timestamp()}> ${rsp}`;
                    lbl.scrollTop = lbl.scrollHeight;
                    if (rsp.endsWith('OK\r\n') || rsp.endsWith('ERROR\r\n')) break;
                }
            }
        });

        document.getElementById('appCmd').addEventListener('keyup', async event => {
            if (event.key === 'Enter') {
                let cmd = event.target.value.trim();
                const lbl = document.getElementById('customCmdRsp');
                const now = new Date();
                setTimeout(async () => {
                    await peripheral.sendCmd(uuidSvcSatellai, uuidCharApp, cmd);
                }, 0);
                // while (true) {
                    rsp = await new Promise(resolve => (resolveApp = resolve));
                    console.log('rsp: ' + rsp);
                    lbl.innerText += `${timestamp()}> ${rsp}`;
                    lbl.scrollTop = lbl.scrollHeight;
                    // if (rsp.endsWith('OK\r\n') || rsp.endsWith('ERROR\r\n')) break;
                // }
                // if (document.getElementById('clearOnSent').checked) event.target.value = '';
            }
        });

        document.getElementById('disconnect').addEventListener('click', async event => {
            //忽略取消订阅
            peripheral.disconnect();
        });

        function chooseFile(input) {
            console.log(input);
            const file = input.files[0];
            if (file) {
                console.log(file);
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const fileContent = new Uint8Array(e.target.result);
                    console.log(`fileContent.length=${fileContent.length}`);
                    const dest = file.name.includes('9160');
                    await firmware_upgrade(fileContent, dest);
                };
                reader.readAsArrayBuffer(file);
            }
        }

        function sendCert(input) {
            console.log(input);
            const file = input.files[0];
            if (file) {
                console.log(file);
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const fileContent = new Uint8Array(e.target.result);
                    console.log(`fileContent.length=${fileContent.length}`);
                    let type;
                    if (file.name.toLowerCase().includes('root')) type = 0;
                    else if (file.name.toLowerCase().includes('cert')) type = 1;
                    else if (file.name.toLowerCase().includes('key')) type = 2;
                    await cert_transfer(fileContent, type);
                };
                reader.readAsArrayBuffer(file);
            }
        }

        function sendFile(input) {
            console.log(input);
            const file = input.files[0];
            if (file) {
                console.log(file);
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const fileContent = new Uint8Array(e.target.result);
                    console.log(`fileContent.length=${fileContent.length}`);
                    const path = document.getElementById('genericfilePath').value;
                    await file_transfer(fileContent, (path?(path+'/'):'')+file.name);
                };
                reader.readAsArrayBuffer(file);
            }
        }

        async function file_transfer(content, name) {
            console.log(`[INFO]SEND START: ${name}`);
            const mtu = 247;
            const size = content.length;
            setTimeout(async () => {
                await peripheral.sendCmd(uuidSvcSatellai, uuidCharDfu, new Uint8Array([1]));
            }, 0);
            let rsp = await new Promise(resolve => (resolveDfu = resolve));
            console.log(new Uint8Array(rsp.buffer)[0]);
            setTimeout(async () => {
                const arr = new Uint8Array(6 + name.length + 1);
                arr.set(new Uint8Array([124, 4+name.length+1, size, size>>8, size>>16, size>>24]));
                arr.set(new TextEncoder().encode(name), 6);
                arr.set(new Uint8Array([0]), 6+name.length);
                console.log(arr);
                await peripheral.sendCmd(uuidSvcSatellai, uuidCharDfu, arr);
            }, 0);
            rsp = await new Promise(resolve => (resolveDfu = resolve));
            console.log(rsp.getUint8(0));
            let idx = 0;

            let crc = 0;
            async function send_buf(base, BLOCK_SIZE) {
                let offset = 0;
                while (offset < BLOCK_SIZE) {
                    let chunkSize = mtu-(mtu>255?4:3);
                    if (offset + chunkSize > BLOCK_SIZE) chunkSize = BLOCK_SIZE - offset;
                    const chunk = content.slice(base + offset, base + offset + chunkSize);
                    const arr = new Uint8Array(chunkSize+(mtu>255?4:3)).fill(0);
                    if (mtu>255) {arr[0] = 125|0x80; arr[1] = (chunkSize+1)&0xff; arr[2] = (chunkSize+1)>>8; arr[3] = idx; arr.set(chunk, 4);}
                    else {arr[0] = 125; arr[1] = chunkSize+1; arr[2] = idx; arr.set(chunk, 3);}
                    await peripheral.sendCmd(uuidSvcSatellai, uuidCharDfu, arr); 
                    // rsp = await new Promise(resolve => (resolveDfu = resolve));
                    // console.log(rsp);
                    crc = crc8(chunk, crc);
                    // console.log(`id=${idx}, offset=${offset}, chunkSize=${chunkSize}, crc=0x${crc.toString(16)}`);
                    offset += chunkSize;
                    idx++;
                }
                setTimeout(async () => {
                    await peripheral.sendCmd(uuidSvcSatellai, uuidCharDfu, new Uint8Array([126, 0]));
                }, 0);
                rsp = await new Promise(resolve => (resolveDfu = resolve));
                const crc_rsp = rsp.getUint8(0);
                if (crc_rsp !== crc) throw 'CRC ERROR';
                return offset;
            }
            const t0 = Date.now();
            let base = 0;
            while (base < size) {
                const left = size - base;
                // console.log(`base=${base}, left=${left}`);
                if (left <= 4096) {
                    base += await send_buf(base, left);
                    console.log(`progress: ${(base / size * 100).toFixed(2)}%`)
                    break;
                }
                base += await send_buf(base, 4096);
                console.log(`progress: ${(base / size * 100).toFixed(2)}%`)
            }
            const t1 = Date.now();
            setTimeout(async () => {
                await peripheral.sendCmd(uuidSvcSatellai, uuidCharDfu, new Uint8Array([127, 0]));
            }, 0);
            rsp = await new Promise(resolve => (resolveDfu = resolve));
            console.log(rsp.getUint32(0, true));
            console.log(`[INFO]SENT ${size} BYTES in ${t1 - t0}ms, TRANSFER RATE: ${(size / (t1 - t0)).toFixed(1)} KB/s`);
        }

        async function cert_transfer(cert, type) {
            console.log('[INFO]SEND START');
            // const cert = new Uint8Array(10000);
            // cert.fill(0x5a);
            const mtu = 247;
            const size = cert.length;
            setTimeout(async () => {

        async function writeNTNsendData() {

            const ntnSendInput = document.getElementById('NTNsend');
            const ntnValue = ntnSendInput.value.trim();
            const selectedMode = document.querySelector('input[name="ntnMode"]:checked').value;
            const responseLabel = document.querySelector('label.rsp[for="writeNTNsendData"]');

            let dataToSend;
            let parsedBytes = [];

            responseLabel.textContent = ''; // Clear previous response/error

            if (!ntnValue) {
                responseLabel.textContent = "错误：输入内容不能为空 (Error: Input cannot be empty)";
                ntnSendInput.focus();
                return;
            }

            if (selectedMode === 'ascii') {
                // In ASCII mode, the string itself is the data (or convert to byte array if needed)
                // For example, converting string to an array of character codes (bytes)
                for (let i = 0; i < ntnValue.length; i++) {
                    parsedBytes.push(ntnValue.charCodeAt(i));
                }
                dataToSend = ntnValue; // Or parsedBytes if you need the byte array
                responseLabel.textContent = `ASCII模式发送: "${dataToSend}" (字节: ${parsedBytes.join(', ')})`;
                console.log("Processing as ASCII:", dataToSend);
                console.log("ASCII Byte Array:", parsedBytes);

            } else if (selectedMode === 'hex') {
                // In Hex mode, parse "B4C7" as 0xB4, 0xC7
                if (ntnValue.length % 2 !== 0) {
                    responseLabel.textContent = "错误：16进制内容长度必须为偶数";
                    ntnSendInput.focus();
                    return;
                }
                if (!/^[0-9a-fA-F]+$/.test(ntnValue)) {
                    responseLabel.textContent = "错误：16进制内容包含无效字符";
                    ntnSendInput.focus();
                    return;
                }

                try {
                    for (let i = 0; i < ntnValue.length; i += 2) {
                        const byteHex = ntnValue.substring(i, i + 2);
                        const byteInt = parseInt(byteHex, 16);
                        if (isNaN(byteInt)) { // Should be caught by regex, but good to double check
                            throw new Error("Invalid hex byte: " + byteHex);
                        }
                        parsedBytes.push(byteInt);
                    }
                    dataToSend = parsedBytes; // This will be an array of numbers like [180, 199] for "B4C7"
                    responseLabel.textContent = `16进制模式发送 (字节): ${parsedBytes.map(b => '0x' + b.toString(16).toUpperCase().padStart(2, '0')).join(', ')}`;
                    console.log("Processing as Hex. Input:", ntnValue);
                    console.log("Hex Byte Array:", parsedBytes);
                    console.log("COMMAND Byte Array:", 'AT+NTNDATA=0,"'+ parsedBytes.map(b => b.toString(16).toUpperCase().padStart(2, '0')).join('') +'"');
                } catch (e) {
                    responseLabel.textContent = "错误：解析16进制内容失败 - " + e.message;
                    console.error("Hex parsing error:", e);
                    return;
                }
            }



            setTimeout(async () => {
                if (selectedMode === 'ascii')
                    await peripheral.sendCmd(uuidSvcNus, uuidCharWrite, 'AT+NTNDATA=0,"'+document.getElementById('NTNsend').value+'"');          
                else
                    await peripheral.sendCmd(uuidSvcNus, uuidCharWrite, 'AT+NTNDATA=1,"'+ parsedBytes.map(b => b.toString(16).toUpperCase().padStart(2, '0')).join('') +'"');          
            }, 0);
            let rsp = '';
            while (true) {
                rsp += await new Promise(resolve => (resolveData = resolve));
                console.log('rsp: ' + rsp);
                if (rsp.endsWith('OK\r\n') || rsp.endsWith('ERROR\r\n')) break;
            }
            console.log(rsp);
            const lbl = document.querySelector(`label[for="writeNTNsendData"]`);
            lbl.innerText = rsp;
            if (rsp.endsWith('OK\r\n')) lbl.style.color ='green';
            else if (rsp.endsWith('ERROR\r\n')) lbl.style.color ='red';
        }

        function getBg95ModuleStateDescription(stateValue) {

            /**
             * BG95_ModuleState C 枚举的对应值和中文描述
             * Corresponding values and Chinese descriptions for the BG95_ModuleState C enum
             */
            const BG95_MODULE_STATE_DESCRIPTIONS = {
                0: "模组硬件开机",          // MODULE_STATE_INIT_POWERON
                1: "基础参数初始化",        // MODULE_STATE_INIT_PARAMETERS
                2: "NTN处理",             // MODULE_STATE_NTN_HANDLE (搜网、注网、PDP上下文激活)
                3: "UDP处理",             // MODULE_STATE_UDP_HANDLE (打包、打开、连接、上报、等待回应、解析回应、关闭)
                4: "GSM处理",             // MODULE_STATE_WWAN_HANDLE (搜网、注网、PDP上下文激活)
                5: "GNSS处理",            // MODULE_STATE_GNSS_HANDLE (采集)
                6: "MQTT处理",            // MODULE_STATE_MQTT_HANDLE (打包、打开、连接、订阅、上报、等待下发消息、关闭)
                7: "XTRA数据处理",        // MODULE_STATE_XTRA_HANDLE (更新和检查XTRA数据)
                8: "低功耗模式",          // MODULE_STATE_LOW_POWER_MODE
                9: "未知/异常状态"        // MODULE_STATE_CNT (通常 MODULE_STATE_CNT 用于表示枚举成员的数量，也可能被用作错误或默认状态)
                // 注意：如果 MODULE_STATE_CNT (值为9) 不是一个有效的运行时状态，而是用于定义枚举大小，
                // 那么在实际应用中，对于接收到的值 9，您可能需要特殊处理或将其视为“未知状态”。
                // Note: If MODULE_STATE_CNT (value 9) is not a valid runtime state but is used to define the enum size,
                // you might need to handle the received value 9 specially or treat it as an "unknown state" in practical applications.
            };
            // 检查传入的值是否为数字
            // Check if the input value is a number
            if (typeof stateValue !== 'number') {
                console.warn("getBg95ModuleStateDescription: 输入值不是一个数字，已收到:", stateValue);
                // Input value is not a number, received:
                return "无效输入 (非数字)"; // Invalid input (not a number)
            }

            // 尝试从映射中获取描述
            // Try to get the description from the mapping
            const description = BG95_MODULE_STATE_DESCRIPTIONS[stateValue];

            if (description) {
                return description;
            } else {
                // 如果枚举值在映射中未定义，则返回一个通用的未知状态提示
                // If the enum value is not defined in the mapping, return a generic unknown state message
                console.warn(`getBg95ModuleStateDescription: 未知的模块状态值: ${stateValue}`);
                // Unknown module state value:
                return `未知状态 (${stateValue})`; // Unknown state
            }
        }

                console.error("Error sending app command or receiving response:", error);
            } finally {
                // Re-enable buttons and inputs in the advanced commands section, respecting initial disabled state if any
                document.querySelectorAll('#appAdvancedCommandsSection .cmd-button, #appAdvancedCommandsSection .cmd-input, #appAdvancedCommandsSection .cmd-textarea').forEach(el => {
                    // Only re-enable if the device is still connected
                    if (peripheral.device && peripheral.device.gatt.connected) {
                        el.disabled = false;
                    }
                });
            }
        }

        // --- Specific command handlers ---

        function handleAppActivateFence() {
            const fidInput = document.getElementById('app_fe1_param_fid');
            const fid = fidInput.value.trim();
            if (!fid) { alert('请输入要激活的围栏ID (Please enter Fence ID to activate)'); fidInput.focus(); return; }
            const command = { c: 'fe1', p: [fid] };
            sendAppCommandViaBle(JSON.stringify(command));
        }

        function handleAppDeactivateFence() {
            const fidInput = document.getElementById('app_fe0_param_fid');
            const fid = fidInput.value.trim();
            if (!fid) { alert('请输入要禁用的围栏ID (Please enter Fence ID to disable)'); fidInput.focus(); return; }
            const command = { c: 'fe0', p: [fid] };
            sendAppCommandViaBle(JSON.stringify(command));
        }

        function handleAppDeleteFence() {
            const fidsInput = document.getElementById('app_fd_param_fids');
            const fidsStr = fidsInput.value.trim();
            if (!fidsStr) { alert('请输入要删除的围栏ID列表，以逗号分隔 (Please enter Fence IDs to delete, comma-separated)'); fidsInput.focus(); return; }
            const fidsArray = fidsStr.split(',').map(s => s.trim()).filter(s => s.length > 0);
            if (fidsArray.length === 0) { alert('请输入有效的围栏ID (Please enter valid Fence IDs)'); fidsInput.focus(); return; }
            const command = { c: 'fd', p: fidsArray };
            sendAppCommandViaBle(JSON.stringify(command));
        }

        function handleAppSetFenceParams() {
            const paddingInput = document.getElementById('app_sfp1_padding');
            const marginInput = document.getElementById('app_sfp1_margin');
            const padding = parseFloat(paddingInput.value);
            const margin = parseFloat(marginInput.value);

            if (isNaN(padding)) { alert('请输入有效的Padding值 (Please enter a valid Padding value)'); paddingInput.focus(); return; }
            if (isNaN(margin)) { alert('请输入有效的Margin值 (Please enter a valid Margin value)'); marginInput.focus(); return; }

            const command = { c: 'sfp1', p: [padding, margin] };
            sendAppCommandViaBle(JSON.stringify(command));
        }

        function handleAppDebugEventGnss() {
            const typeInput = document.getElementById('app_debug_event_type');
            const latInput = document.getElementById('app_debug_event_lat');
            const lngInput = document.getElementById('app_debug_event_lng');

            const type = parseInt(typeInput.value);
            const lat = parseFloat(latInput.value);
            const lng = parseFloat(lngInput.value);

            if (isNaN(type) || type < 1 || type > 6) { alert('请输入有效的Type值 (1-6) (Please enter a valid Type value (1-6))'); typeInput.focus(); return; }
            if (isNaN(lat)) { alert('请输入有效的Latitude值 (Please enter a valid Latitude value)'); latInput.focus(); return; }
            if (isNaN(lng)) { alert('请输入有效的Longitude值 (Please enter a valid Longitude value)'); lngInput.focus(); return; }

            const command = { c: 'debug.event_gnss', p: { type: type, lat: lat, lng: lng } };
            sendAppCommandViaBle(JSON.stringify(command));
        }

        // 父页面JS
        function receiveAmapFenceData(data) {
            const openEditBtn = document.getElementById('openEditorBtn');
            console.log("从围栏编辑器接收到的数据:", data);
            openEditBtn.disabled = false;
            displayReceivedData(data);

            closeFenceEditor(); // 关闭编辑器模态框
        }

        function formatCoordinates(pointsArray) {
            if (!pointsArray || pointsArray.length === 0) return "无坐标点";
            let formatted = [];
            for (let i = 0; i < pointsArray.length; i += 2) {
                if (pointsArray[i+1] !== undefined) {
                    formatted.push(`[${pointsArray[i].toFixed(6)}, ${pointsArray[i+1].toFixed(6)}]`);
                }
            }
            return formatted.join(', ');
        }
        function displayReceivedData(data) {
            const dataListDiv = document.getElementById('dataList');
            if (!data) { // 检查 data 是否存在
                dataListDiv.innerHTML = '<p class="text-gray-500 italic">接收到的数据为空或无效。</p>';
                return;
            }
            // 将接收到的数据对象转换为格式化的JSON字符串
            const jsonString = JSON.stringify(data); // null, 2 用于美化输出（缩进2个空格）
            try {
                sendAppCommandViaBle(jsonString);
            } catch (e) {
                alert('添加围栏参数JSON无效 (Invalid JSON for Add Fence parameters): ' + e.message);
                console.error('Invalid JSON for Add Fence:', e);
                paramJsonTextarea.focus();
            }
            // 将JSON字符串包裹在<pre>标签中以保持格式，并应用Tailwind样式
            dataListDiv.innerHTML = `<pre class="bg-white p-3 border border-gray-200 rounded-md text-sm shadow overflow-auto max-h-96">${jsonString}</pre>`;
        }

        // 父页面JS
        function openFenceEditor() {
            const iframe = document.getElementById('fenceEditorFrame');
            iframe.style.display = 'block';
            console.log("打开编辑器模态框");

            if (iframe.contentWindow && typeof iframe.contentWindow.openEditorModal === 'function') {
              iframe.contentWindow.openEditorModal();
            }
        }

        function editorModalClosed() {
            console.log("编辑器模态框已由iframe内部关闭。");
             if (document.getElementById('fenceEditorFrame').style.display !== 'none') {
                closeFenceEditor();
            }
        }

        function closeFenceEditor() {
            document.getElementById('fenceEditorFrame').style.display = 'none';
        }
