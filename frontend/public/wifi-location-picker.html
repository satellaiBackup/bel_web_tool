<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择 Wi-Fi 信标位置</title>
    <link rel="icon" href="./assets/app.ico" sizes="any">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            color: #1f2937;
            background: rgba(15, 23, 42, 0.35);
        }

        .modal {
            box-sizing: border-box;
            width: min(1040px, calc(100% - 32px));
            height: min(760px, calc(100% - 32px));
            margin: 16px auto;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 18px 48px rgba(15, 23, 42, 0.28);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            border-bottom: 1px solid #e5e7eb;
            background: #f8fafc;
        }

        .title {
            font-size: 16px;
            font-weight: 700;
        }

        .hint {
            font-size: 12px;
            color: #6b7280;
            margin-top: 3px;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .coordinate {
            min-width: 238px;
            padding: 7px 9px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #fff;
            font-family: Consolas, monospace;
            font-size: 12px;
        }

        button {
            border: 0;
            border-radius: 6px;
            padding: 8px 12px;
            color: #fff;
            background: #2563eb;
            cursor: pointer;
            font-size: 13px;
        }

        button.secondary {
            background: #4b5563;
        }

        button:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        #map {
            width: 100%;
            flex: 1;
            min-height: 360px;
            border-top: 1px solid #e5e7eb;
        }

        .error {
            padding: 14px;
            color: #b91c1c;
            background: #fee2e2;
            border-bottom: 1px solid #fecaca;
            display: none;
        }
    </style>
</head>
<body>
    <div class="modal">
        <div id="error" class="error" role="alert" aria-live="assertive"></div>
        <div class="toolbar">
            <div>
                <div class="title">选择 Wi-Fi 信标位置</div>
                <div class="hint">点击地图设置经纬度，确认后会回填到添加信标表单。</div>
            </div>
            <div class="actions">
                <div id="coordinate" class="coordinate">尚未选择位置</div>
                <button id="confirmBtn" disabled>使用此位置</button>
                <button class="secondary" onclick="closePicker()">取消</button>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <script>
        const amapSdkUrl = 'https://webapi.amap.com/maps?v=2.0&key=7d85ff33aabb204519ebeac3dd8d9035&plugin=AMap.Marker';
        const defaultLocation = { lat: 22.539307, lng: 113.952685 };
        let map;
        let marker;
        let selected;
        let mapReady = false;
        let amapSdkPromise;
        let mapInitialization;
        let latestOpenRequest = {};
        let openRequestId = 0;

        function notifyParent(type, payload = {}) {
            if (!window.parent || window.parent === window) return;
            window.parent.postMessage({ type, ...payload }, window.location.origin);
        }

        function showError(message) {
            const el = document.getElementById('error');
            el.textContent = message;
            el.style.display = 'block';
            notifyParent('wifi-location-picker-error', { message });
        }

        function clearError() {
            const el = document.getElementById('error');
            el.textContent = '';
            el.style.display = 'none';
        }

        function format(value) {
            return Number(value).toFixed(6);
        }

        function updateSelected(lng, lat) {
            if (!mapReady || !map) return;
            selected = { lng: Number(format(lng)), lat: Number(format(lat)) };
            document.getElementById('coordinate').textContent = `lat ${format(selected.lat)}, lng ${format(selected.lng)}`;
            document.getElementById('confirmBtn').disabled = false;

            if (!marker) {
                marker = new AMap.Marker({ position: [selected.lng, selected.lat] });
                map.add(marker);
            } else {
                marker.setPosition([selected.lng, selected.lat]);
            }
            map.setCenter([selected.lng, selected.lat]);
        }

        function closePicker() {
            try {
                if (window.parent && typeof window.parent.closeWifiLocationPicker === 'function') {
                    window.parent.closeWifiLocationPicker();
                    return;
                }
            } catch (error) {
                console.warn(error);
            }
            window.parent.postMessage({ type: 'wifi-location-cancel' }, '*');
        }

        function confirmLocation() {
            if (!selected) return;
            try {
                if (window.parent && typeof window.parent.setWifiTagLocation === 'function') {
                    window.parent.setWifiTagLocation(selected);
                    window.parent.closeWifiLocationPicker();
                    return;
                }
            } catch (error) {
                console.warn(error);
            }
            window.parent.postMessage({ type: 'wifi-location-selected', ...selected }, '*');
        }

        function loadAmapSdk() {
            if (window.AMap && typeof window.AMap.Map === 'function') {
                return Promise.resolve(window.AMap);
            }
            if (amapSdkPromise) return amapSdkPromise;

            amapSdkPromise = new Promise((resolve, reject) => {
                const script = document.createElement('script');
                let settled = false;
                const timeout = window.setTimeout(() => {
                    finish(reject, new Error('高德地图 SDK 加载超时'));
                }, 10000);
                const finish = (callback, value) => {
                    if (settled) return;
                    settled = true;
                    window.clearTimeout(timeout);
                    callback(value);
                };

                script.src = amapSdkUrl;
                script.async = true;
                script.dataset.amapSdk = 'true';
                script.addEventListener('load', () => {
                    if (window.AMap && typeof window.AMap.Map === 'function') {
                        finish(resolve, window.AMap);
                    } else {
                        finish(reject, new Error('高德地图 SDK 已加载但 AMap.Map 不可用'));
                    }
                }, { once: true });
                script.addEventListener('error', () => {
                    finish(reject, new Error('高德地图 SDK 网络加载失败'));
                }, { once: true });
                document.head.appendChild(script);
            }).catch(error => {
                amapSdkPromise = undefined;
                throw error;
            });
            return amapSdkPromise;
        }

        function waitForMapContainer(timeoutMs = 3000) {
            const startedAt = performance.now();
            return new Promise((resolve, reject) => {
                const check = () => {
                    const rect = document.getElementById('map').getBoundingClientRect();
                    if (rect.width > 0 && rect.height > 0) {
                        resolve(rect);
                        return;
                    }
                    if (performance.now() - startedAt >= timeoutMs) {
                        reject(new Error('地图容器不可见或尺寸为 0'));
                        return;
                    }
                    requestAnimationFrame(check);
                };
                check();
            });
        }

        function resolveLocation(request = {}) {
            const hasLat = request.lat !== undefined && request.lat !== null && String(request.lat).trim() !== '';
            const hasLng = request.lng !== undefined && request.lng !== null && String(request.lng).trim() !== '';
            const lat = Number(request.lat);
            const lng = Number(request.lng);
            const hasInitial = hasLat && hasLng
                && Number.isFinite(lat) && Number.isFinite(lng)
                && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180;
            return hasInitial
                ? { lat, lng, zoom: 15 }
                : { ...defaultLocation, zoom: 11 };
        }

        function resizeMap() {
            if (!map || typeof map.resize !== 'function') return;
            map.resize();
        }

        async function ensureMap(request) {
            if (map) return map;
            if (mapInitialization) return mapInitialization;

            mapInitialization = (async () => {
                await waitForMapContainer();
                const amap = await loadAmapSdk();
                await waitForMapContainer();
                const location = resolveLocation(request);
                map = new amap.Map('map', {
                    zoom: location.zoom,
                    center: [location.lng, location.lat],
                    resizeEnable: true
                });
                map.on('click', event => {
                    updateSelected(event.lnglat.lng, event.lnglat.lat);
                });
                mapReady = true;
                return map;
            })().catch(error => {
                mapInitialization = undefined;
                throw error;
            });
            return mapInitialization;
        }

        async function openPicker(request = {}) {
            latestOpenRequest = request;
            const requestId = ++openRequestId;
            clearError();
            try {
                await ensureMap(request);
                if (requestId !== openRequestId) return;
                const location = resolveLocation(latestOpenRequest);
                updateSelected(location.lng, location.lat);
                requestAnimationFrame(resizeMap);
            } catch (error) {
                showError(`地图初始化失败：${error.message || error}。请检查网络，并关闭 JShelter 等可能干扰 WebGL/canvas 的扩展后重试。`);
            }
        }

        function mapRuntimeErrorText(event) {
            return [event.message, event.filename, event.error?.stack]
                .filter(Boolean)
                .join(' ');
        }

        function handleMapRuntimeError(event) {
            const details = mapRuntimeErrorText(event);
            const extensionInterference = /JShelter|wrappers_generated|SecurityError.*cross-origin|WebGL/i.test(details);
            const amapFailure = /webapi\.amap\.com|maps\?|AMap|getStatus|canvas/i.test(details);
            if (!extensionInterference && !amapFailure) return;
            const message = extensionInterference
                ? '检测到浏览器扩展干扰地图渲染。请关闭 JShelter 等扩展，并在 Edge InPrivate 窗口重试。'
                : '地图渲染失败。请关闭可能干扰 WebGL/canvas 的扩展后重试；若仍失败，请检查高德地图 SDK 网络状态。';
            showError(message);
            event.preventDefault();
        }

        window.addEventListener('message', (event) => {
            if (event.source !== window.parent || event.origin !== window.location.origin) return;
            if (event.data?.type === 'wifi-location-picker-open') {
                openPicker(event.data);
            }
        });
        window.addEventListener('error', handleMapRuntimeError);
        window.addEventListener('unhandledrejection', event => {
            const reason = event.reason instanceof Error ? event.reason : new Error(String(event.reason || ''));
            const syntheticEvent = {
                message: reason.message,
                error: reason,
                preventDefault: () => event.preventDefault()
            };
            handleMapRuntimeError(syntheticEvent);
        });

        document.getElementById('confirmBtn').addEventListener('click', confirmLocation);
        if (window.parent === window) {
            const params = new URLSearchParams(window.location.search);
            openPicker({ lat: params.get('lat'), lng: params.get('lng') });
        }
    </script>
</body>
</html>
