<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./assets/app.ico" sizes="any">
    <link rel="icon" type="image/png" href="./assets/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
    <link rel="manifest" href="./site.webmanifest">
    <meta name="theme-color" content="#06224a">
    <title>蓝牙调试助手</title>
    <style type="text/tailwindcss">
      .font-10pt {
        font-size: 10pt;
      }
      body {
        font-family: 'Inter', sans-serif, monospace;
      }
      button.cmd-button {
        @apply bg-blue-500 hover:bg-blue-700 text-white py-2 px-4 rounded-lg shadow-md transition-colors duration-150 ease-in-out font-10pt hover:bg-orange-700;
      }
      button.cmd-button:disabled {
        @apply bg-gray-300 hover:bg-gray-300 cursor-not-allowed shadow-none;
      }
      input[type="text"], input[type="file"], select {
        @apply border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent;
      }
      label#status {
        @apply px-2 py-1 rounded-md;
      }
    </style>
  </head>
  <body class="font-mono p-4 md:p-8 bg-gray-50 text-gray-800">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
